<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metro PIS Display</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#fff;
}

.container{
    display:flex;
    width:100%;
    height:100%;
}

/* CLOCK AREA */
.clock-section{
    width:35%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffffff;
    border-right:4px solid #d0d0d0;
}

.clock{
    width:320px;
    height:320px;
    border:8px solid #444;
    border-radius:50%;
    position:relative;
    background:white;
}

/* Clock Numbers */
.number{
    position:absolute;
    width:100%;
    height:100%;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.number span{
    display:inline-block;
}

.number1 { transform: rotate(30deg); }
.number1 span { transform: rotate(-30deg); }

.number2 { transform: rotate(60deg); }
.number2 span { transform: rotate(-60deg); }

.number3 { transform: rotate(90deg); }
.number3 span { transform: rotate(-90deg); }

.number4 { transform: rotate(120deg); }
.number4 span { transform: rotate(-120deg); }

.number5 { transform: rotate(150deg); }
.number5 span { transform: rotate(-150deg); }

.number6 { transform: rotate(180deg); }
.number6 span { transform: rotate(-180deg); }

.number7 { transform: rotate(210deg); }
.number7 span { transform: rotate(-210deg); }

.number8 { transform: rotate(240deg); }
.number8 span { transform: rotate(-240deg); }

.number9 { transform: rotate(270deg); }
.number9 span { transform: rotate(-270deg); }

.number10 { transform: rotate(300deg); }
.number10 span { transform: rotate(-300deg); }

.number11 { transform: rotate(330deg); }
.number11 span { transform: rotate(-330deg); }

.number12 span{
    position:relative;
    top:8px;
}

/* Logo inside clock */
.logo{
    position:absolute;
    top:42%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    font-weight:bold;
    color:#0055aa;
    font-size:20px;
    line-height:1.2;
}

/* Clock Hands */
.hand{
    position:absolute;
    bottom:50%;
    left:50%;
    transform-origin:bottom;
    transform:translateX(-50%);
    border-radius:10px;
}

.hour{
    width:8px;
    height:75px;
    background:#222;
}

.minute{
    width:5px;
    height:110px;
    background:#444;
}

.second{
    width:2px;
    height:125px;
    background:red;
}

.center{
    position:absolute;
    width:16px;
    height:16px;
    background:#222;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* INFO AREA */
.info-section{
    width:65%;
    display:flex;
    flex-direction:column;
}

.header{
    height:80px;
    background:#FFD400;
    display:flex;
    align-items:center;
    padding-left:25px;
    font-size:38px;
    font-weight:bold;
    color:#222;
}

.sub-header{
    height:70px;
    background:white;
    display:flex;
    align-items:center;
    padding-left:25px;
    font-size:34px;
    border-bottom:2px solid #ddd;
}

.content{
    flex:1;
    background:#1f2a44;
    color:white;
    padding:30px;
    font-size:42px;
    font-weight:500;
}
</style>
</head>

<body>

<div class="container">

    <!-- Clock Section -->
    <div class="clock-section">

        <div class="clock">

            <div class="logo">
                YOUR<br>COMPANY
            </div>

            <div class="number number1"><span>1</span></div>
            <div class="number number2"><span>2</span></div>
            <div class="number number3"><span>3</span></div>
            <div class="number number4"><span>4</span></div>
            <div class="number number5"><span>5</span></div>
            <div class="number number6"><span>6</span></div>
            <div class="number number7"><span>7</span></div>
            <div class="number number8"><span>8</span></div>
            <div class="number number9"><span>9</span></div>
            <div class="number number10"><span>10</span></div>
            <div class="number number11"><span>11</span></div>
            <div class="number number12"><span>12</span></div>

            <div class="hand hour" id="hour"></div>
            <div class="hand minute" id="minute"></div>
            <div class="hand second" id="second"></div>

            <div class="center"></div>

        </div>

    </div>

    <!-- Information Area -->
    <div class="info-section">

        <div class="header">
            MANKAMESHWAR MANDIR
            <span style="margin-left:auto;margin-right:25px;">
                4 min
            </span>
        </div>

        <div class="sub-header">
            मनःकामेश्वर मंदिर
            <span style="margin-left:auto;margin-right:25px;">
                4 मिनट
            </span>
        </div>

        <div class="content">
            INFORMATION AREA<br><br>
            • Next Train Information<br>
            • Advertisements<br>
            • Emergency Messages<br>
            • Route Maps<br>
            • Public Announcements
        </div>

    </div>

</div>

<script>

function updateClock(){

    const now = new Date();

    const sec = now.getSeconds();
    const min = now.getMinutes();
    const hr = now.getHours();

    const secDeg = sec * 6;
    const minDeg = min * 6 + sec * 0.1;
    const hrDeg = (hr % 12) * 30 + min * 0.5;

    document.getElementById('second').style.transform =
        `translateX(-50%) rotate(${secDeg}deg)`;

    document.getElementById('minute').style.transform =
        `translateX(-50%) rotate(${minDeg}deg)`;

    document.getElementById('hour').style.transform =
        `translateX(-50%) rotate(${hrDeg}deg)`;
}

setInterval(updateClock,1000);
updateClock();

</script>

</body>
</html>
